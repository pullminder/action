name: "Pullminder Registry Validation"
description: "Validate Pullminder custom rule registries and post results as PR comments"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  version:
    description: "CLI version to use"
    default: "latest"
  mode:
    description: "Action mode: 'registry' for registry validation, 'pr-review' for PR risk scoring"
    default: "registry"
  command:
    description: "Registry subcommand to run (only applies to mode: registry)"
    default: "validate"
  strict:
    description: "Enable strict validation (only applies to mode: registry)"
    default: "true"
  api-token:
    description: "API token for Pullminder platform (reserved for future use in mode: pr-review)"
    default: ""
  fail-on:
    description: "Minimum severity that causes failure: critical, high, medium, low (only applies to mode: pr-review)"
    default: ""
  fail-on-count:
    description: "Maximum number of findings allowed before failing (only applies to mode: pr-review)"
    default: ""
  config:
    description: "Path to config file (only applies to mode: pr-review)"
    default: ""
  comment:
    description: "Post results as PR comment"
    default: "true"
  working-directory:
    description: "Path to registry root or working directory for pr-review mode"
    default: "."

runs:
  using: "composite"
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        echo "os=$OS" >> "$GITHUB_OUTPUT"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
        echo "binary=pullminder-${OS}-${ARCH}" >> "$GITHUB_OUTPUT"

    - name: Determine download URL
      id: url
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO="pullminder/cli"
        if [ "${{ inputs.version }}" = "latest" ]; then
          # Resolve "latest" to a concrete tag so the cache key changes when a
          # new release ships. A static "pullminder-latest" key is immutable in
          # actions/cache and would pin the first-seen binary forever.
          #
          # Read the response into a variable first: piping curl directly into
          # `grep -m1` makes grep close the pipe after the first match, so curl
          # gets EPIPE and exits 23 — which `pipefail` would turn into a step
          # failure (intermittently, depending on buffering).
          RELEASE_JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest")"
          TAG="$(printf '%s' "$RELEASE_JSON" \
                 | grep '"tag_name"' \
                 | head -n1 \
                 | sed -E 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve latest ${REPO} release tag"
            exit 1
          fi
          echo "url=https://github.com/${REPO}/releases/download/${TAG}/${{ steps.platform.outputs.binary }}" >> "$GITHUB_OUTPUT"
          echo "cache_key=pullminder-${TAG}" >> "$GITHUB_OUTPUT"
        else
          echo "url=https://github.com/${REPO}/releases/download/v${{ inputs.version }}/${{ steps.platform.outputs.binary }}" >> "$GITHUB_OUTPUT"
          echo "cache_key=pullminder-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache CLI binary
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/pullminder
        key: ${{ steps.url.outputs.cache_key }}-${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}

    - name: Download and verify CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        BIN_URL="${{ steps.url.outputs.url }}"
        CHECKSUMS_URL="${BIN_URL%/*}/checksums.txt"
        ARTIFACT_NAME="${{ steps.platform.outputs.binary }}"

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT

        curl -fsSL "$BIN_URL"        -o "$TMP/pullminder"
        curl -fsSL "$CHECKSUMS_URL"  -o "$TMP/checksums.txt"

        if command -v sha256sum >/dev/null 2>&1; then
          SHA_CMD="sha256sum"
        else
          SHA_CMD="shasum -a 256"
        fi

        EXPECTED="$(grep " ${ARTIFACT_NAME}\$" "$TMP/checksums.txt" | awk '{print $1}')"
        ACTUAL="$(${SHA_CMD} "$TMP/pullminder" | awk '{print $1}')"

        if [ -z "$EXPECTED" ]; then
          echo "::error::pullminder ${ARTIFACT_NAME} not listed in checksums.txt — refusing to run"
          exit 1
        fi
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::pullminder binary checksum mismatch (expected=$EXPECTED actual=$ACTUAL)"
          exit 1
        fi

        sudo mv "$TMP/pullminder" /usr/local/bin/pullminder
        sudo chmod +x /usr/local/bin/pullminder

    - name: Run pullminder
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PULLMINDER_TOKEN: ${{ inputs.api-token }}
      run: |
        if [ "${{ inputs.mode }}" = "pr-review" ]; then
          ARGS="ci --json"
          if [ -n "${{ inputs.fail-on }}" ]; then
            ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"
          fi
          if [ -n "${{ inputs.config }}" ]; then
            ARGS="$ARGS --config ${{ inputs.config }}"
          fi
        else
          ARGS="registry ${{ inputs.command }}"
          if [ "${{ inputs.strict }}" = "true" ] && [ "${{ inputs.command }}" = "validate" ]; then
            ARGS="$ARGS --strict"
          fi
        fi

        set +e
        OUTPUT=$(pullminder $ARGS 2>&1)
        EXIT_CODE=$?
        set -e

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"

        EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
        echo "output<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"

        echo "$OUTPUT"

    - name: Check fail-on-count threshold
      if: inputs.mode == 'pr-review' && inputs.fail-on-count != ''
      shell: bash
      env:
        OUTPUT: ${{ steps.run.outputs.output }}
        FAIL_ON_COUNT: ${{ inputs.fail-on-count }}
      run: |
        if command -v jq >/dev/null 2>&1 && echo "$OUTPUT" | jq -e . >/dev/null 2>&1; then
          FINDINGS_COUNT=$(echo "$OUTPUT" | jq '[.. | .findings? | objects] | add | length' 2>/dev/null || echo "0")
          if [ "$FINDINGS_COUNT" -gt "$FAIL_ON_COUNT" ]; then
            echo "::error::findings count ($FINDINGS_COUNT) exceeds threshold ($FAIL_ON_COUNT)"
            exit 1
          fi
        fi

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OUTPUT: ${{ steps.run.outputs.output }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        MODE: ${{ steps.run.outputs.mode }}
        FAIL_ON_COUNT: ${{ inputs.fail-on-count }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/comment.sh"

    - name: Exit with CLI status
      if: steps.run.outputs.exit_code != '0'
      shell: bash
      run: exit ${{ steps.run.outputs.exit_code }}
