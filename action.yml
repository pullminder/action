name: "Pullminder Action"
description: "Validate Pullminder rule registries, run PR risk reviews, or execute CI checks with annotations and artifact upload"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  version:
    description: "CLI version to use"
    default: "latest"
  mode:
    description: "Action mode: 'registry' for registry validation, 'pr-review' for PR risk scoring, 'ci' for CI annotations with artifact upload"
    default: "registry"
  command:
    description: "Registry subcommand to run (only applies to mode: registry)"
    default: "validate"
  strict:
    description: "Enable strict validation (only applies to mode: registry)"
    default: "true"
  api-token:
    description: "API token for Pullminder platform (reserved for future use in mode: pr-review)"
    default: ""
  fail-on:
    description: "Minimum severity that causes failure: critical, high, medium, low (only applies to mode: pr-review or ci)"
    default: ""
  fail-on-count:
    description: "Maximum number of findings allowed before failing (only applies to mode: pr-review or ci)"
    default: ""
  config:
    description: "Path to config file (only applies to mode: pr-review or ci)"
    default: ""
  include:
    description: "Glob patterns to include in CI scan (only applies to mode: ci)"
    default: ""
  exclude:
    description: "Glob patterns to exclude from CI scan (only applies to mode: ci)"
    default: ""
  upload-artifact:
    description: "Upload raw CLI output as workflow artifact (only applies to mode: ci)"
    default: "true"
  comment:
    description: "Post results as PR comment"
    default: "true"
  working-directory:
    description: "Working directory for CLI invocation. Registry mode: path to registry root. pr-review/ci: path to repository."
    default: "."
  coverage-mode:
    description: "Coverage mode: 'artifact' (default, upload as GitHub artifact) or 'webhook' (POST directly to Pullminder)"
    default: "artifact"
  coverage-webhook-token:
    description: "Coverage webhook token for webhook mode (set PULLMINDER_COVERAGE_TOKEN env var instead for security)"
    default: ""
  coverage-webhook-url:
    description: "Custom webhook URL (defaults to Pullminder API)"
    default: ""
  coverage-file:
    description: "Path to coverage file to upload in webhook mode"
    default: ""

runs:
  using: "composite"
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        echo "os=$OS" >> "$GITHUB_OUTPUT"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
        echo "binary=pullminder-${OS}-${ARCH}" >> "$GITHUB_OUTPUT"

    - name: Determine download URL
      id: url
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO="pullminder/cli"
        if [ "${{ inputs.version }}" = "latest" ]; then
          RELEASE_JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest")"
          TAG="$(printf '%s' "$RELEASE_JSON" \
                 | grep '"tag_name"' \
                 | head -n1 \
                 | sed -E 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve latest ${REPO} release tag"
            exit 1
          fi
          echo "url=https://github.com/${REPO}/releases/download/${TAG}/${{ steps.platform.outputs.binary }}" >> "$GITHUB_OUTPUT"
          echo "cache_key=pullminder-${TAG}" >> "$GITHUB_OUTPUT"
        else
          echo "url=https://github.com/${REPO}/releases/download/v${{ inputs.version }}/${{ steps.platform.outputs.binary }}" >> "$GITHUB_OUTPUT"
          echo "cache_key=pullminder-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache CLI binary
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/pullminder
        key: ${{ steps.url.outputs.cache_key }}-${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}

    - name: Download and verify CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        BIN_URL="${{ steps.url.outputs.url }}"
        CHECKSUMS_URL="${BIN_URL%/*}/checksums.txt"
        ARTIFACT_NAME="${{ steps.platform.outputs.binary }}"

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT

        curl -fsSL "$BIN_URL"        -o "$TMP/pullminder"
        curl -fsSL "$CHECKSUMS_URL"  -o "$TMP/checksums.txt"

        if command -v sha256sum >/dev/null 2>&1; then
          SHA_CMD="sha256sum"
        else
          SHA_CMD="shasum -a 256"
        fi

        EXPECTED="$(grep " ${ARTIFACT_NAME}\$" "$TMP/checksums.txt" | awk '{print $1}')"
        ACTUAL="$(${SHA_CMD} "$TMP/pullminder" | awk '{print $1}')"

        if [ -z "$EXPECTED" ]; then
          echo "::error::pullminder ${ARTIFACT_NAME} not listed in checksums.txt — refusing to run"
          exit 1
        fi
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::pullminder binary checksum mismatch (expected=$EXPECTED actual=$ACTUAL)"
          exit 1
        fi

        sudo mv "$TMP/pullminder" /usr/local/bin/pullminder
        sudo chmod +x /usr/local/bin/pullminder

    - name: Validate inputs
      if: always()
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        COMMENT: ${{ inputs.comment }}
      run: |
        if [ "$MODE" = "ci" ] && [ "$COMMENT" != "false" ]; then
          echo "::warning title=ci-mode-comment::ci mode typically does not post PR comments. Set comment: \"false\" to silence this warning."
        fi

    - name: Run pullminder
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PULLMINDER_TOKEN: ${{ inputs.api-token }}
      run: |
        if [ "${{ inputs.mode }}" = "pr-review" ]; then
          ARGS="ci --json"
          if [ -n "${{ inputs.fail-on }}" ]; then
            ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"
          fi
          if [ -n "${{ inputs.config }}" ]; then
            ARGS="$ARGS --config ${{ inputs.config }}"
          fi
        elif [ "${{ inputs.mode }}" = "ci" ]; then
          ARGS="ci --json --github-annotations"
          if [ -n "${{ inputs.fail-on }}" ]; then
            ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"
          fi
          if [ -n "${{ inputs.config }}" ]; then
            ARGS="$ARGS --config ${{ inputs.config }}"
          fi
          if [ -n "${{ inputs.include }}" ]; then
            ARGS="$ARGS --include ${{ inputs.include }}"
          fi
          if [ -n "${{ inputs.exclude }}" ]; then
            ARGS="$ARGS --exclude ${{ inputs.exclude }}"
          fi
        else
          ARGS="registry ${{ inputs.command }}"
          if [ "${{ inputs.strict }}" = "true" ] && [ "${{ inputs.command }}" = "validate" ]; then
            ARGS="$ARGS --strict"
          fi
        fi

        set +e
        OUTPUT=$(pullminder $ARGS 2>&1)
        EXIT_CODE=$?
        set -e

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"

        EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
        echo "output<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"

        echo "$OUTPUT"

    - name: Check fail-on-count threshold
      if: (inputs.mode == 'pr-review' || inputs.mode == 'ci') && inputs.fail-on-count != ''
      shell: bash
      env:
        OUTPUT: ${{ steps.run.outputs.output }}
        FAIL_ON_COUNT: ${{ inputs.fail-on-count }}
      run: |
        if command -v jq >/dev/null 2>&1 && echo "$OUTPUT" | jq -e . >/dev/null 2>&1; then
          FINDINGS_COUNT=$(echo "$OUTPUT" | jq '[.. | .findings? | objects] | add | length' 2>/dev/null || echo "0")
          if [ "$FINDINGS_COUNT" -gt "$FAIL_ON_COUNT" ]; then
            echo "::error::findings count ($FINDINGS_COUNT) exceeds threshold ($FAIL_ON_COUNT)"
            exit 1
          fi
        fi

    - name: Save CLI output
      if: inputs.mode == 'ci' && inputs.upload-artifact == 'true' && always()
      shell: bash
      env:
        OUTPUT: ${{ steps.run.outputs.output }}
      run: |
        echo "$OUTPUT" > pullminder-output.json

    - name: Upload artifact
      if: inputs.mode == 'ci' && inputs.upload-artifact == 'true' && always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: pullminder-output
        path: pullminder-output.json

    - name: Upload coverage via webhook
      if: inputs.coverage-mode == 'webhook'
      shell: bash
      env:
        COVERAGE_TOKEN: ${{ inputs.coverage-webhook-token }}
        COVERAGE_URL: ${{ inputs.coverage-webhook-url }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        HEAD_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        # Auto-detect coverage file
        if [ -n "$COVERAGE_FILE" ]; then
          FILE="$COVERAGE_FILE"
        elif [ -f "lcov.info" ]; then
          FILE="lcov.info"
        elif [ -f "cover.out" ]; then
          FILE="cover.out"
        elif [ -f "coverage/lcov.info" ]; then
          FILE="coverage/lcov.info"
        elif [ -f "coverage/coverage.info" ]; then
          FILE="coverage/coverage.info"
        else
          echo "::error::coverage file not found. Specify via coverage-file input or ensure one of: lcov.info, cover.out, coverage/lcov.info, coverage/coverage.info"
          exit 1
        fi

        echo "::group::Upload coverage to Pullminder"
        echo "Coverage file: $FILE"

        # Resolve token (input takes precedence over env var)
        TOKEN="${COVERAGE_TOKEN:-${PULLMINDER_COVERAGE_TOKEN:-}}"
        if [ -z "$TOKEN" ]; then
          echo "::error::coverage-webhook-token input or PULLMINDER_COVERAGE_TOKEN env var must be set"
          exit 1
        fi

        # Determine webhook URL (default to Pullminder API)
        URL="${COVERAGE_URL:-https://api.pullminder.com/api/v1/coverage/webhook}"

        # Base64-encode the coverage file
        echo "Encoding coverage data..."
        ENCODED=$(base64 -w0 < "$FILE")
        FILE_SIZE=$(wc -c < "$FILE" | tr -d ' ')
        echo "File size: ${FILE_SIZE} bytes"

        # Build JSON payload
        if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
          PAYLOAD=$(jq -c -n \
            --arg data "$ENCODED" \
            --arg sha "$HEAD_SHA" \
            --argjson pr "$PR_NUMBER" \
            '{data: $data, head_sha: $sha, pr_number: $pr}')
        else
          echo "::warning::No PR number detected -- coverage will be uploaded without PR association"
          PAYLOAD=$(jq -c -n \
            --arg data "$ENCODED" \
            --arg sha "$HEAD_SHA" \
            '{data: $data, head_sha: $sha}')
        fi

        # POST to webhook
        echo "Uploading to: ${URL}"
        HTTP_CODE=$(curl -s -o /tmp/cov-response.txt -w "%{http_code}" -X POST "$URL" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" 2>&1)

        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "Upload successful (HTTP ${HTTP_CODE})"
        else
          RESPONSE_BODY=$(cat /tmp/cov-response.txt 2>/dev/null || echo "")
          echo "::error::coverage upload failed with HTTP ${HTTP_CODE}: ${RESPONSE_BODY}"
          exit 1
        fi

        echo "::endgroup::"

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OUTPUT: ${{ steps.run.outputs.output }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        MODE: ${{ steps.run.outputs.mode }}
        FAIL_ON_COUNT: ${{ inputs.fail-on-count }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/comment.sh"

    - name: Exit with CLI status
      if: steps.run.outputs.exit_code != '0'
      shell: bash
      run: exit ${{ steps.run.outputs.exit_code }}
